<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>OpenRange · Jellyfin</title>
<link rel="stylesheet" href="/lib/tv.css">
<style>
  /* Theme: Jellyfin colours (background #101010, accent #00a4dc, the brand's purple→blue gradient).*/
  body { overflow: hidden; background: #101010; color: #fff; }
  .tela { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #101010; }
  h1 { margin: 0; font-weight: 600; }
  h2 { font-size: 22px; font-weight: 500; color: #fff; margin: 14px 0 6px 56px; }
  .vazio { color: #999; margin: 40px 56px; font-size: 20px; }
  .dica { color: #777; font-size: 15px; }
  .contagem { color: #999; font-size: 17px; }

  /* barra superior */
  .barra { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; height: 76px; padding: 0 56px; }
  .logo { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 28px; font-weight: 600;
          margin-right: 44px; }
  .logo-marca { width: 34px; height: 34px; margin-right: 12px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
                background: -webkit-linear-gradient(315deg, #aa5cc3, #00a4dc); background: linear-gradient(135deg, #aa5cc3, #00a4dc); }
  .abas { -webkit-flex: 1; flex: 1; }
  .aba { display: inline-block; padding: 8px 22px; margin-right: 8px; border-radius: 22px; font-size: 20px; color: #bbb; }
  .aba.ativa { color: #fff; box-shadow: inset 0 -3px 0 #00a4dc; border-radius: 0; }
  .aba.foco { background: #00a4dc; color: #fff; -webkit-transform: none; transform: none; box-shadow: none; border-radius: 22px; }
  .barra-dir { font-size: 20px; color: #bbb; }
  .barra-dir .hora { font-size: 26px; color: #fff; margin-left: 18px; font-weight: 300; }

  /* login */
  .tela-login { padding: 120px 160px; text-align: center; }
  .tela-login h1 { font-size: 40px; margin-bottom: 30px; }
  .tela-login .codigo { font: 700 96px/1 monospace; letter-spacing: 18px; color: #00a4dc; margin: 20px 0 30px; }
  .tela-login p { font-size: 22px; color: #ddd; max-width: 900px; margin: 12px auto; }
  .tela-login .estado { color: #999; font-size: 18px; }

  /* listas (servidores, login, ajustes) e entrada de texto */
  .tela-lista h1, .tela-entrada h1 { font-size: 34px; padding: 44px 56px 4px; }
  .tela-lista > .dica, .tela-entrada > .dica { padding: 0 56px 14px; font-size: 18px; color: #999; margin: 0; }
  .lista { padding: 6px 56px 60px; }
  .lista h2 { margin: 22px 0 8px; font-size: 17px; color: #00a4dc; text-transform: uppercase; letter-spacing: 1px; }
  .linha { padding: 12px 18px; margin-bottom: 6px; border-radius: 6px; background: #1c1c1c; position: relative; }
  .linha-titulo { font-size: 21px; }
  .linha-sub { font-size: 16px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-valor { position: absolute; right: 18px; top: 12px; font-size: 19px; color: #bbb; max-width: 760px; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .linha.foco { background: #00a4dc; -webkit-transform: none; transform: none; box-shadow: none; }
  .linha.foco .linha-sub, .linha.foco .linha-valor { color: #fff; }
  .usuarios { min-height: 0; }
  .tela-entrada .busca-campo { margin: 0 56px; }
  .tela-entrada .estado { padding: 8px 56px 0; margin: 0; height: 30px; font-size: 18px; color: #999; }
  .tela-entrada .estado.ruim { color: #ff6b6b; }
  /* Keyboard as a rectangle: every row takes the same width and keys share the space equally
     (rows with the same number of keys → aligned columns; the actions row splits evenly among few keys).*/
  .fila-teclas { display: -webkit-flex; display: flex; }
  .fila-teclas .tecla { -webkit-flex: 1 1 0; flex: 1 1 0; width: auto; margin: 4px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .tecla.acao { font-size: 17px; }
  .teclado.grande { width: 990px; margin: 8px auto; }
  .linha.marcada .linha-titulo { color: #00a4dc; }
  .linha.marcada.foco .linha-titulo { color: #fff; }

  /* phone pairing*/
  .tela-par h1 { font-size: 34px; padding: 44px 56px 10px; }
  .par-corpo { display: -webkit-flex; display: flex; padding: 10px 56px; }
  .par-qr { width: 380px; min-height: 380px; margin-right: 44px; background: #fff; border-radius: 8px; text-align: center; color: #000; }
  .par-qr img { width: 380px; height: 380px; display: block; }
  .par-txt { width: 740px; font-size: 21px; color: #ddd; }
  .par-link { font: 600 25px/1.4 monospace; color: #00a4dc; word-break: break-all; margin: 6px 0 14px; }
  .par-txt .estado { font-size: 20px; color: #bbb; min-height: 56px; }
  .par-txt .estado.ruim { color: #ff6b6b; }

  /* screensaver*/
  #protetor { display: none; position: fixed; left: 0; top: 0; width: 1280px; height: 720px; background: #000; z-index: 90; }
  #protetor.visivel { display: block; }
  #protetor div { position: absolute; font-size: 90px; font-weight: 200; color: #555; }
  .tecla.ligada { box-shadow: inset 0 -4px 0 #00a4dc; }
  .tecla.confirma { background: #00a4dc; font-weight: 600; }
  .tecla.confirma.foco { box-shadow: 0 0 0 3px #fff; }

  /* fileiras */
  .tela-inicio .dica { padding: 6px 56px 40px; }
  .fileira { white-space: nowrap; overflow: hidden; padding: 10px 56px 12px; font-size: 0; }
  .fileira .cartao { display: inline-block; vertical-align: top; margin-right: 18px; }

  /* cards*/
  .cartao { width: 150px; font-size: 16px; position: relative; white-space: normal; }
  .cartao .capa { display: block; width: 150px; height: 225px; object-fit: cover; border-radius: 6px; background: #202020; }
  .cartao.largo { width: 256px; }
  .cartao.largo .capa { width: 256px; height: 144px; }
  .cartao.pessoa { width: 130px; text-align: center; }
  .cartao.pessoa .capa { width: 130px; height: 130px; border-radius: 65px; }
  .cartao.quadrado .capa { height: 150px; }
  .cartao.quadrado .capa + .progresso { top: 145px; }

  /* album*/
  .album-topo { display: -webkit-flex; display: flex; padding: 50px 56px 10px; }
  .album-capa { width: 260px; height: 260px; object-fit: cover; border-radius: 8px; margin-right: 40px; background: #202020;
                box-shadow: 0 10px 30px rgba(0,0,0,.7); }
  .album-info h1 { font-size: 40px; margin-top: 20px; }
  .album-info .meta { color: #ccc; font-size: 19px; margin-top: 10px; }
  .faixas-lista { padding: 10px 56px 60px; }
  .faixa { display: -webkit-flex; display: flex; padding: 10px 16px; border-radius: 6px; font-size: 20px; color: #ddd; }
  .faixa .num { width: 50px; color: #999; }
  .faixa .nome { -webkit-flex: 1; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .faixa .dur { color: #999; }
  .faixa.foco { background: #00a4dc; color: #fff; -webkit-transform: none; transform: none; box-shadow: none; }
  .faixa.foco .num, .faixa.foco .dur { color: #fff; }
  .cartao .placa { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
                   -webkit-justify-content: center; justify-content: center; text-align: center; padding: 10px;
                   font-weight: 600; font-size: 17px; color: #ccc; overflow: hidden;
                   background: -webkit-linear-gradient(315deg, #2a2233, #14262e); background: linear-gradient(135deg, #2a2233, #14262e); }
  .cartao .titulo { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .cartao .sub { color: #999; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 18px; text-align: center; }
  .cartao .progresso { position: absolute; left: 0; right: 0; height: 5px; background: rgba(0,0,0,.7); }
  .cartao .progresso div { height: 5px; background: #00a4dc; }
  .cartao .capa + .progresso { top: 220px; }
  .cartao.largo .capa + .progresso { top: 139px; }
  .cartao .selo { position: absolute; right: 6px; top: 6px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
                  background: #00a4dc; color: #fff; text-align: center; line-height: 26px; font-weight: 700; font-size: 15px; }
  .cartao .selo.fav { left: 6px; right: auto; background: rgba(0,0,0,.6); color: #ff4d6a; }
  .cartao.foco { -webkit-transform: scale(1.08); transform: scale(1.08); box-shadow: none; }
  .cartao.foco .capa { box-shadow: 0 0 0 4px #00a4dc, 0 8px 24px rgba(0,0,0,.8); }

  /* grade */
  .tela-grade h1 { font-size: 32px; padding: 26px 56px 2px; }
  .tela-grade .contagem { padding: 0 56px 10px; }
  .grade { padding: 10px 46px 60px; font-size: 0; }
  .grade .cartao { display: inline-block; vertical-align: top; margin: 0 12px 24px; }

  /* busca */
  .busca-area { display: -webkit-flex; display: flex; padding: 6px 56px; }
  .busca-esq { width: 470px; margin-right: 30px; }
  .busca-campo { height: 52px; line-height: 52px; padding: 0 16px; border-radius: 6px; background: #292929; font-size: 24px;
                 white-space: nowrap; overflow: hidden; border-bottom: 3px solid #00a4dc; }
  .busca-campo.vazio:before { content: 'Buscar…'; color: #777; }
  .teclado { margin: 14px -4px 10px; }
  .tecla { display: inline-block; width: 39px; height: 50px; line-height: 50px; margin: 4px; border-radius: 6px; background: #292929;
           font-size: 22px; text-align: center; }
  .tecla.larga { width: 133px; font-size: 17px; }
  .tecla.foco { background: #00a4dc; -webkit-transform: scale(1.1); transform: scale(1.1); box-shadow: none; }
  .busca-dir { width: 668px; height: 620px; }
  .busca-dir .grade { padding: 14px 0 60px; }
  .busca-dir .grade .cartao { margin: 0 9px 22px; }

  /* detalhe */
  .tela-detalhe .fundo { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background-size: cover;
                          background-position: center top; opacity: .25; }
  .tela-detalhe .conteudo { position: relative; display: -webkit-flex; display: flex; padding: 56px 56px 10px; min-height: 560px; }
  .tela-detalhe .lado { width: 280px; margin-right: 40px; }
  .tela-detalhe .poster { width: 280px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.7); }
  .tela-detalhe .info { width: 848px; }
  .tela-detalhe .serie { color: #00a4dc; font-size: 22px; margin-bottom: 4px; }
  .tela-detalhe h1 { font-size: 40px; line-height: 1.1; }
  .tela-detalhe .original { color: #999; font-size: 18px; margin-top: 4px; }
  .tela-detalhe .meta { color: #ddd; font-size: 19px; margin: 12px 0 6px; }
  .tela-detalhe .generos { color: #999; font-size: 17px; }
  .tela-detalhe .tagline { font-size: 20px; font-style: italic; color: #ccc; margin-top: 10px; }
  .tela-detalhe .sinopse { font-size: 19px; line-height: 1.45; color: #ddd; max-height: 138px; overflow: hidden; margin: 12px 0 0; }
  .tela-detalhe .faixas { font-size: 16px; color: #999; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tela-detalhe .extras { position: relative; padding-bottom: 50px; }
  .botoes { margin: 20px 0 8px; }
  .botao { display: inline-block; padding: 12px 24px; margin: 0 12px 12px 0; border-radius: 6px; background: #303030; font-size: 20px;
           max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
  .botao[data-botao="play"] { background: #00a4dc; font-weight: 600; }
  .botao.seletor { font-size: 17px; padding: 14px 18px; color: #ddd; }
  .botao.foco { -webkit-transform: scale(1.06); transform: scale(1.06); box-shadow: 0 0 0 3px #fff; }

  /* player */
  #player { display: none; position: fixed; left: 0; top: 0; width: 1280px; height: 720px; background: #000; z-index: 40; }
  #player.visivel { display: block; }
  #video { width: 1280px; height: 720px; background: #000; }
  #osd { position: fixed; left: 0; right: 0; bottom: 0; padding: 60px 56px 34px; z-index: 41; opacity: 0;
         background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.85)); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.85));
         -webkit-transition: opacity .25s; transition: opacity .25s; }
  #osd.visivel { opacity: 1; }
  /* Subtitles drawn by player.js with our font (the TV's native cue font misplaces ê â ô). Raised over the OSD. */
  #legenda-tela { position: fixed; left: 80px; right: 80px; bottom: 56px; z-index: 41; text-align: center; color: #fff;
                  font-size: 34px; font-weight: 600; line-height: 1.25; white-space: pre-line; pointer-events: none;
                  text-shadow: 0 0 4px #000, 2px 2px 2px #000, -2px -2px 2px #000, 2px -2px 2px #000, -2px 2px 2px #000; }
  #legenda-tela span { background: rgba(0,0,0,.35); padding: 0 8px; }
  #osd.visivel ~ #legenda-tela { bottom: 190px; }
  #osd-titulo { font-size: 28px; font-weight: 600; margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #osd-trilho { height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; position: relative; }
  #osd-marcas div { position: absolute; top: -3px; width: 3px; height: 12px; background: #fff; opacity: .8; }
  #osd-marcas { position: absolute; left: 0; top: 0; width: 100%; height: 6px; }
  #trick { display: none; position: relative; margin-bottom: 12px; background-color: #000; background-repeat: no-repeat;
           border: 2px solid #fff; border-radius: 4px; }
  #trick.visivel { display: block; }
  #pular { display: none; position: fixed; right: 56px; bottom: 150px; z-index: 44; padding: 14px 26px; border-radius: 6px;
           background: rgba(16,16,16,.9); border: 2px solid #fff; font-size: 22px; }
  #pular.visivel { display: block; }
  #menu { display: none; position: fixed; right: 0; top: 0; width: 440px; height: 720px; z-index: 45; padding: 20px 24px 60px;
          background: rgba(16,16,16,.94); overflow: hidden; }
  #menu.visivel { display: block; }
  #menu h3 { margin: 18px 0 8px; font-size: 17px; font-weight: 500; color: #00a4dc; text-transform: uppercase; letter-spacing: 1px; }
  #menu .opcao { padding: 9px 14px; border-radius: 6px; font-size: 19px; color: #ccc; white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; margin-bottom: 2px; }
  #menu .opcao.ligada { color: #fff; }
  #menu .nota { padding: 9px 14px; font-size: 18px; color: #aaa; white-space: normal; }
  #menu .opcao.foco { background: #00a4dc; color: #fff; -webkit-transform: none; transform: none; box-shadow: none; }
  #capa-audio { display: none; position: fixed; left: 0; top: 70px; width: 1280px; text-align: center; z-index: 41; font-size: 24px; color: #ccc; }
  #player.audio #capa-audio { display: block; }
  #player.audio #video { visibility: hidden; }
  #capa-audio img { width: 360px; height: 360px; object-fit: cover; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.8); margin-bottom: 18px; }
  #osd-barra { height: 6px; width: 0; background: #00a4dc; border-radius: 3px; }
  #osd-linha { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
               margin-top: 10px; font-size: 20px; color: #ddd; }
  #info { display: none; position: fixed; right: 40px; top: 40px; z-index: 42; padding: 16px 22px; border-radius: 8px;
          background: rgba(0,0,0,.8); font: 17px/1.5 monospace; white-space: pre-wrap; word-wrap: break-word;
          max-width: 760px; max-height: 640px; overflow: hidden; color: #eee; }
  #info.visivel { display: block; }
  #proximo { display: none; position: fixed; left: 50%; top: 300px; width: 900px; margin-left: -450px; z-index: 43;
             padding: 26px 34px; border-radius: 10px; background: rgba(32,32,32,.96); font-size: 26px; text-align: center; }
  #proximo.visivel { display: block; }
</style>
</head>
<body>
<div id="telas"></div>
<div id="protetor"><div></div></div>
<div id="player">
  <video id="video" preload="auto"></video>
  <div id="osd">
    <div id="osd-titulo"></div>
    <div id="trick"></div>
    <div id="osd-trilho"><div id="osd-barra"></div><div id="osd-marcas"></div></div>
    <div id="osd-linha"><span id="osd-tempo"></span><span id="osd-estado"></span></div>
  </div>
  <div id="legenda-tela"></div>
  <div id="info"></div>
  <div id="proximo"></div>
  <div id="pular"></div>
  <div id="capa-audio"></div>
  <div id="menu" class="rolavel"></div>
</div>
<script src="/lib/tv.js"></script>
<script src="/lib/vendor/qrcode.js"></script>
<script src="jf.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
