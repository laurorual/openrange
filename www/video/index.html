<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>OpenRange · Teste de vídeo</title>
<link rel="stylesheet" href="/lib/tv.css">
<style>
  body { overflow: hidden; }
  #topo { height: 64px; padding: 16px 40px 0; font-size: 28px; font-weight: 700; }
  #topo span { color: #539bf5; }
  #area { display: -webkit-flex; display: flex; padding: 0 40px; }
  #lista { width: 470px; margin-right: 30px; height: 600px; overflow: hidden; }
  .separador { font-size: 16px; color: #768390; margin: 14px 4px 6px; }
  .item { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
          padding: 7px 14px; margin-bottom: 5px; border-radius: 8px; background: #1c2128; font-size: 18px; }
  .item.foco { -webkit-transform: none; transform: none; background: #316dca; box-shadow: none; }
  .item .res { font-weight: 700; margin-left: 10px; white-space: nowrap; }
  .ok { color: #57ab5a; } .lento { color: #c69026; } .falhou { color: #e5534b; } .rodando { color: #539bf5; }
  .item.foco .ok, .item.foco .lento, .item.foco .falhou, .item.foco .rodando { color: #fff; }
  #direita { width: 700px; }
  #tela { width: 700px; height: 394px; background: #000; position: relative; }
  #video { width: 100%; height: 100%; background: #000; }
  body.cheio #video { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; z-index: 50; }
  body.cheio #stats { position: fixed; left: 20px; top: 20px; z-index: 51; background: rgba(0,0,0,.7); padding: 10px 14px;
                      width: auto; font-size: 16px; }
  #stats { margin-top: 12px; font: 15px/1.35 monospace; color: #adbac7; white-space: pre; height: 210px; overflow: hidden; }
  #ajuda { position: fixed; left: 40px; right: 40px; bottom: 14px; font-size: 17px; color: #768390; }
  #ajuda b { color: #adbac7; font-weight: 500; margin-right: 20px; }
</style>
</head>
<body>
<div id="topo"><span>tv</span>lab · teste de vídeo</div>
<div id="area">
  <div id="lista" class="rolavel"></div>
  <div id="direita">
    <div id="tela"><video id="video" preload="auto"></video></div>
    <div id="stats">Escolha um teste e aperte OK, ou verde para rodar todos.</div>
  </div>
</div>
<div id="ajuda"><b>OK roda o teste</b><b><span class="tecla-cor verde"></span>roda a rodada 2</b><b>1–5 avalia</b><b><span class="tecla-cor amarelo"></span>tela cheia</b><b><span class="tecla-cor vermelho"></span>para</b><b>Voltar sai</b></div>
<script src="/lib/tv.js"></script>
<script src="/lib/vendor/hls.min.js"></script>
<script src="video.js"></script>
</body>
</html>
